<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOLES — Live</title>
<style>
  :root {
    --bg:#0e1116; --surf:#171b22; --line:#262c36; --text:#e6e9ef; --dim:#8b93a1;
    --ok:#37d67a; --hot:#ff5c5c; --cool:#4aa8ff; --accent:#ffb020;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; letter-spacing:.3px; }
  header .sub { color:var(--dim); font-size:13px; }
  #status { margin-left:auto; font-size:13px; color:var(--dim); }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--hot); }
  main { padding:20px; display:grid; gap:16px;
         grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .card { background:var(--surf); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .badge { font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px;
           border:1px solid var(--line); color:var(--dim); }
  .badge.on { background:rgba(55,214,122,.15); color:var(--ok); border-color:transparent; }
  .row { display:flex; justify-content:space-between; padding:4px 0; }
  .row .k { color:var(--dim); } .row .v { font-variant-numeric:tabular-nums; }
  .big { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .big .u { font-size:14px; color:var(--dim); font-weight:400; margin-left:4px; }
  .spark { margin-top:10px; }
  .foot { margin-top:8px; font-size:12px; color:var(--dim); }
  .empty { color:var(--dim); padding:20px; }
</style>
</head>
<body>
<header>
  <h1>MOLES — Live</h1>
  <span class="sub">breathing verdicts from the backend API · polling every 3&nbsp;s</span>
  <span id="status">connecting…</span>
</header>
<main id="cards"><div class="empty">Starting…</div></main>
<script src="live.js"></script>
</body>
</html>
